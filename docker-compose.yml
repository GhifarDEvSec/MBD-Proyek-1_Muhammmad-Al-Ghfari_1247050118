version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_ghifari
    env_file:
      - .env
    ports:
      - "22118:5432"
    volumes:
      - pgdata_ghifari:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ghifari
    env_file:
      - .env
    ports:
      - "44118:80"
    depends_on:
      - db

volumes:
  pgdata_ghifari: